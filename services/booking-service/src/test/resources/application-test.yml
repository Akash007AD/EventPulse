spring:
  datasource:
    url: jdbc:h2:mem:eventpulse_booking_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

event-service:
  base-url: http://localhost:8081
  connect-timeout-ms: 1000
  read-timeout-ms: 1000

booking:
  hold-duration-minutes: 15

logging:
  level:
    root: INFO
    com.eventpulse.booking: DEBUG
