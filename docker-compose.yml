# ==============================================================================
# EventPulse - Root Master Docker Compose Blueprint
# Runs 15-container microservices ecosystem from repository root:
# - Infrastructure: MySQL 8, Redis 7, Keycloak 26, Kafka KRaft, RabbitMQ
# - Observability: Prometheus, Grafana, Zipkin
# - Application: API Gateway (8080), Event Service (8081), Booking Service (8082),
#                Payment Service (8083), Notification Service (8084),
#                Analytics Service (8085), AI Discovery Service (8086)
# ==============================================================================

services:
  # -------------------------------------------------------------
  # Core Infrastructure Layer
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: eventpulse-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - eventpulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=root"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eventpulse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eventpulse-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KC_HOSTNAME_PORT: "8180"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-google-client-secret}
    volumes:
      - ./backend/infrastructure/keycloak/eventpulse-realm.json:/opt/keycloak/data/import/eventpulse-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eventpulse-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: eventpulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - eventpulse-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eventpulse-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eventpulse-network

  # -------------------------------------------------------------
  # Observability & Distributed Tracing Layer
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eventpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - eventpulse-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: eventpulse-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - eventpulse-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: eventpulse-zipkin
    ports:
      - "9411:9411"
    networks:
      - eventpulse-network

  # -------------------------------------------------------------
  # EventPulse Microservices Backend Application Layer
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./backend/gateway
    container_name: eventpulse-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EVENT_SERVICE_URL=http://event-service:8081
      - BOOKING_SERVICE_URL=http://booking-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085
      - AI_SERVICE_URL=http://ai-service:8086
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - keycloak
      - event-service
      - booking-service
      - payment-service
    networks:
      - eventpulse-network

  event-service:
    build:
      context: ./backend/services/event-service
    container_name: eventpulse-event-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/eventpulse_event?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventpulse-network

  booking-service:
    build:
      context: ./backend/services/booking-service
    container_name: eventpulse-booking-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/eventpulse_booking?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EVENTPULSE_EVENT_SERVICE_URL=http://event-service:8081
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      event-service:
        condition: service_started
    networks:
      - eventpulse-network

  payment-service:
    build:
      context: ./backend/services/payment-service
    container_name: eventpulse-payment-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/eventpulse_payment?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - EVENTPULSE_BOOKING_SERVICE_URL=http://booking-service:8082
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - eventpulse-network

  notification-service:
    build:
      context: ./backend/services/notification-service
    container_name: eventpulse-notification-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/eventpulse_notification?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - NOTIFICATION_MAIL_FROM=${MAIL_FROM:-no-reply@eventpulse.com}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - eventpulse-network

  analytics-service:
    build:
      context: ./backend/services/analytics-service
    container_name: eventpulse-analytics-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/eventpulse_analytics?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - eventpulse-network

  ai-service:
    build:
      context: ./backend/services/ai-service
    container_name: eventpulse-ai-service
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
      - EVENTPULSE_EVENT_SERVICE_URL=http://event-service:8081
      - GROQ_API_KEY=${GROQ_API_KEY:-mock}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-gpt-oss-20b}
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/eventpulse
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      event-service:
        condition: service_started
    networks:
      - eventpulse-network

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  eventpulse-network:
    name: eventpulse-network
    driver: bridge
