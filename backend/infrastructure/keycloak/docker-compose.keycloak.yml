services:
  keycloak-db:
    image: mysql:8.0
    container_name: eventpulse-keycloak-db
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak_password
      MYSQL_ROOT_PASSWORD: keycloak_root_password
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - keycloak_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - eventpulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "keycloak", "--password=keycloak_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eventpulse-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_PORT: "8180"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-google-client-secret}
    volumes:
      - ./eventpulse-realm.json:/opt/keycloak/data/import/eventpulse-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - eventpulse-network

volumes:
  keycloak_mysql_data:

networks:
  eventpulse-network:
    name: eventpulse-network
    driver: bridge
