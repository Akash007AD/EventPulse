server:
  port: ${BOOKING_SERVICE_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:3306}/${BOOKING_DB_NAME:eventpulse_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${BOOKING_DB_USERNAME:root}
    password: ${BOOKING_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: BookingServiceHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

event-service:
  base-url: ${EVENT_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

booking:
  hold-duration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.eventpulse.booking: DEBUG
    org.springframework.web: INFO
