server:
  port: 0

spring:
  application:
    name: analytics-service-test

  datasource:
    url: jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    listener:
      auto-startup: false
    consumer:
      group-id: eventpulse-analytics-test-group
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eventpulse

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.eventpulse.analytics: DEBUG
