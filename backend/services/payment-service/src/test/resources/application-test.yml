server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eventpulse

razorpay:
  key-id: rzp_test_dummy
  key-secret: test_secret_key_12345
  webhook-secret: test_webhook_secret_67890

booking:
  service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.eventpulse.payment: DEBUG
