spring:
  datasource:
    url: jdbc:h2:mem:eventpulse_event_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    root: INFO
    com.eventpulse.event: DEBUG
    org.flywaydb: DEBUG
